name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The golden-file test compares a hash of the example PDF. Output is
      # deterministic by design, so drift here is a real signal.
      - run: cargo test --all-targets

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # No em dash in the Markdown docs. Rules in charcheck.config.json.
      - run: npx -y charcheck@0.4.1

  line-endings:
    name: line endings
    runs-on: windows-latest
    steps:
      # Windows has no browser, no shell script and no font lookup to break.
      # What can break is path handling and line endings, so check the second
      # explicitly rather than assuming the first covers it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check out with CRLF
        run: |
          git config core.autocrlf true
          git rm --cached -r . --quiet
          git reset --hard
      - run: cargo test --all-targets

  commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: false
