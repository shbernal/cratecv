[package]
name = "cratecv"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "Compile a YAML resume to a one-page PDF, with layout guardrails machines can read."
authors = ["shbernal"]
license = "MIT"
repository = "https://github.com/shbernal/cratecv"
keywords = ["resume", "cv", "typst", "pdf", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "cratecv"
path = "src/lib.rs"

[[bin]]
name = "cratecv"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
comemo = "0.5"
lopdf = { version = "0.45", default-features = false }
marked-yaml = { version = "0.8.0", features = ["serde", "serde-path"] }
notify = "8.2.0"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-library = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-svg = "=0.15.1"
typst-utils = "=0.15.1"

# `release` stays quick, because ~/.local/bin/cratecv points at its output and
# relinking it is part of the edit loop. The shipped binaries use `dist`.
[package.metadata.deb]
assets = [
    ["target/*/dist/cratecv", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/cratecv/README.md", "644"],
    ["THIRD_PARTY_NOTICES.md", "usr/share/doc/cratecv/THIRD_PARTY_NOTICES.md", "644"],
]
extended-description = """
Compiles a YAML resume into a one-page PDF with Typst, and reports layout problems - overflow, and lines that leave space behind - as JSON a script or an assistant can act on."""

[profile.dist]
inherits = "release"
lto = true
strip = true

[dev-dependencies]
jsonschema = "0.57"
marked-yaml = "0.8.0"
sha2 = "0.11.0"
