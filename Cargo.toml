[package]
name = "cratecv"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
description = "Compile a YAML resume to a one-page PDF, with layout guardrails machines can read."
authors = ["shbernal"]
license = "MIT"
repository = "https://github.com/shbernal/cratecv"
keywords = ["resume", "cv", "typst", "pdf", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "cratecv"
path = "src/lib.rs"

[[bin]]
name = "cratecv"
path = "src/main.rs"

[dependencies]
marked-yaml = { version = "0.8.0", features = ["serde", "serde-path"] }
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
lto = true
strip = true
